---
name: psql-cluster-node3

networks:
  app_net:
    external: true
  web_net:
    external: true

volumes:
  etcd3_data:
    name: etcd3_data
    driver: local
  patroni3_data:
    name: patroni3_data
    driver: local

services:
  etcd3:
    image: registry.mecan.ir/devops_certification/db-cluster/psql-cluster/pg-patroni:17
    hostname: etcd3
    container_name: etcd3
    restart: unless-stopped
    command: etcd --name etcd3 --initial-advertise-peer-urls http://${NODE_IP}:2380
    volumes:
      - etcd3_data:/home/postgres
    network_mode: host
    user: "0:0"
    environment:
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://${NODE_IP}:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://${NODE_IP}:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://${NODE1_IP}:2380,etcd2=http://${NODE2_IP}:2380,etcd3=http://${NODE3_IP}:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: tutorial
      ETCD_UNSUPPORTED_ARCH: arm64
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health --endpoints=http://127.0.0.1:2379 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  patroni3:
    image: registry.mecan.ir/devops_certification/db-cluster/psql-cluster/pg-patroni:17
    hostname: patroni3
    container_name: patroni3
    entrypoint:
      - /bin/sh
      - -ec
      - chmod +rx /entrypoint.sh || true; chmod -R a+rX /patroni /patroni.py || true; exec su -s /bin/sh postgres -c /entrypoint.sh
    restart: unless-stopped
    volumes:
      - patroni3_data:/home/postgres
    network_mode: host
    user: root
    environment:
      PATRONI_NAME: patroni3
      ETCDCTL_ENDPOINTS: http://${NODE1_IP}:2379,http://${NODE2_IP}:2379,http://${NODE3_IP}:2379
      PATRONI_ETCD3_HOSTS: ${NODE1_IP}:2379,${NODE2_IP}:2379,${NODE3_IP}:2379
      PATRONI_SCOPE: production
      PATRONI_RESTAPI_USERNAME: ${PATRONI_RESTAPI_USERNAME}
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD}
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: ${NODE_IP}:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${NODE_IP}:5432
      PATRONI_SUPERUSER_USERNAME: ${PATRONI_SUPERUSER_USERNAME}
      PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_REPLICATION_USERNAME}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD}
      PATRONI_admin_PASSWORD: ${PATRONI_ADMIN_PASSWORD}
      PATRONI_admin_OPTIONS: createdb,createrole
      PATRONI_BOOTSTRAP_POST_INIT: /post_init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  haproxy3:
    image: registry.mecan.ir/devops_certification/db-cluster/psql-cluster/pg-patroni:17
    network_mode: host
    hostname: haproxy3
    container_name: haproxy3
    command: haproxy
    restart: unless-stopped
    user: root
    healthcheck:
      test: ["CMD-SHELL", "pidof haproxy >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      ETCDCTL_ENDPOINTS: http://${NODE1_IP}:2379,http://${NODE2_IP}:2379,http://${NODE3_IP}:2379
      PATRONI_ETCD3_HOSTS: ${NODE1_IP}:2379,${NODE2_IP}:2379,${NODE3_IP}:2379
      PATRONI_SCOPE: production
      PATRONI_RESTAPI_USERNAME: ${PATRONI_RESTAPI_USERNAME}
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD}
      PATRONI_SUPERUSER_USERNAME: ${PATRONI_SUPERUSER_USERNAME}
      PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_REPLICATION_USERNAME}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD}
      PATRONI_admin_PASSWORD: ${PATRONI_ADMIN_PASSWORD}
      PATRONI_admin_OPTIONS: createdb,createrole


  authoritative3:
    image: powerdns/pdns-auth-50:latest
    container_name: authoritative3
    hostname: authoritative3
    restart: ${RESTART_POLICY}
    depends_on:
      patroni3:
        condition: service_healthy
      haproxy3:
        condition: service_healthy
    environment:
      PDNS_AUTH_API_KEY: ${PDNS_API_KEY}
    volumes:
      - ./pdns/pdns.conf:/etc/powerdns/pdns.conf:ro
    ports:
      - "5300:53/tcp"
      - "5300:53/udp"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',53)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net
    extra_hosts:
      - "haproxy3:${NODE_IP}"

  recursor3:
    image: powerdns/pdns-recursor-50:latest
    container_name: recursor3
    hostname: recursor3
    restart: ${RESTART_POLICY}
    environment:
      PDNS_RECURSOR_API_KEY: ${PDNS_RECURSOR_API_KEY}
    volumes:
      - ./recursor/recursor.conf:/etc/powerdns/recursor.conf:ro
    ports:
      - "5301:53/tcp"
      - "5301:53/udp"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rec_control ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  dnsdist3:
    image: powerdns/dnsdist-20:latest
    container_name: dnsdist3
    hostname: dnsdist3
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      recursor3:
        condition: service_healthy
      authoritative3:
        condition: service_healthy
    command:
      - --supervised
      - -C
      - /etc/dnsdist/dnsdist.conf
    environment:
      DNSDIST_API_KEY: ${DNSDIST_API_KEY}
      DNSDIST_AUTH_ZONE: ${DNSDIST_AUTH_ZONE}
      AUTH_HOST: authoritative3
      RECURSOR_HOST: recursor3
      REMOTE1_IP: ${NODE1_IP}
      REMOTE2_IP: ${NODE2_IP}
    volumes:
      - ./dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro
    ports:
      - "5454:53/tcp"
      - "5454:53/udp"
      - "8084:8083"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',53)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  poweradmin3:
    image: poweradmin/poweradmin:stable
    container_name: poweradmin3
    hostname: poweradmin3
    restart: ${RESTART_POLICY}
    depends_on:
      patroni3:
        condition: service_healthy
      haproxy3:
        condition: service_healthy
      authoritative3:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      PA_CREATE_ADMIN: "true"
      PA_ADMIN_PASSWORD: ${PA_ADMIN_PASSWORD}
      DB_TYPE: pgsql
      DB_HOST: haproxy3
      DB_PORT: "5000"
      PGPORT: "5000"
      DB_USER: ${PA_DB_USER}
      DB_PASS: ${PA_DB_PASSWORD}
      DB_NAME: ${PA_DB_NAME}
      DNS_NS1: ${DNS_NS1}
      DNS_NS2: ${DNS_NS2}
      DNS_HOSTMASTER: ${DNS_HOSTMASTER}
      PA_PDNS_API_URL: http://authoritative3:8081
      PA_PDNS_API_KEY: ${PDNS_API_KEY}
      PA_PDNS_SERVER_NAME: localhost
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - web_net
      - app_net
    extra_hosts:
      - "haproxy3:${NODE_IP}"
      - "authoritative3:${NODE_IP}"
      - "recursor3:${NODE_IP}"
