setLocal("0.0.0.0:53")
setACL({"0.0.0.0/0", "::/0"})

webserver("0.0.0.0:8083")
setWebserverConfig({apiKey=os.getenv("DNSDIST_API_KEY"), acl="0.0.0.0/0,::/0"})

local function resolveHost(hostname)
    local handle = io.popen("getent hosts " .. hostname .. " | awk '{print $1}'")
    local ip = handle:read("*a"):match("^%s*(.-)%s*$")
    handle:close()
    return ip
end

newServer({address = resolveHost(os.getenv("AUTH_HOST")) .. ":53", pool = "auth", order = 1})
newServer({address = resolveHost(os.getenv("RECURSOR_HOST")) .. ":53", pool = "recursors", order = 1})

local remote1 = os.getenv("REMOTE1_IP")
local remote2 = os.getenv("REMOTE2_IP")

if remote1 ~= nil and remote1 ~= "" then
    newServer({address = remote1 .. ":5300", pool = "auth", order = 2})
    newServer({address = remote1 .. ":5301", pool = "recursors", order = 2})
end

if remote2 ~= nil and remote2 ~= "" then
    newServer({address = remote2 .. ":5300", pool = "auth", order = 3})
    newServer({address = remote2 .. ":5301", pool = "recursors", order = 3})
end

setServerPolicy(firstAvailable)

addAction(QNameSuffixRule(os.getenv("DNSDIST_AUTH_ZONE")), PoolAction("auth"))
addAction(QNameSuffixRule("in-addr.arpa."), PoolAction("auth"))
addAction(QNameSuffixRule("ip6.arpa."), PoolAction("auth"))
addAction(AllRule(), PoolAction("recursors"))
